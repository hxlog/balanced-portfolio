name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BP_JWT_SECRET: ci-only-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: 后端测试（无外部 DB/Redis 依赖，全部 mock/临时库）
        run: python -m pytest bp_api/tests -q
      - name: 行情 CLI 冒烟
        run: python -m bp_ingest --help
      - name: FastAPI 应用导入冒烟
        run: python -c "from bp_api.main import app; print(f'{len(app.routes)} routes')"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: 类型检查
        run: npm run typecheck
      - name: 前端单元测试
        run: npm test
      - name: 生产构建
        run: npm run build
