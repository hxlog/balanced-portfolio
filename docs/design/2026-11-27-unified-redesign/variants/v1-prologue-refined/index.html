CHARTS.riskStack = function(el){
  var W = chartWidth(el), H = parseInt(el.getAttribute('data-h') || '92', 10);
  var barY = 16, barH = 26, left = 0, right = 0;
  var total = BASKET_SECTORS.reduce(function(s, x){ return s + x.value; }, 0);

function handleAct(name, el, e){
  var val = el.getAttribute('data-val');
  if (name === 'a-index' || name === 'a-win' || name === 'a-metric'){
    if (e) e.preventDefault();
    if (name === 'a-index') state.A.index = val;
    if (name === 'a-win') state.A.win = val === 'all' ? 'all' : Number(val);
    if (name === 'a-metric') state.A.metric = val;
    refreshBand();
    return;
  }
  if (name === 'a-divmode'){ state.A.divMode = val; swapCard('[data-card="dividend"]', aDivCard); return; }
  if (name === 'a-sort'){
    var key = el.getAttribute('data-key');
    if (state.A.sortKey === key) state.A.sortDir = state.A.sortDir === 'asc' ? 'desc' : 'asc';
    else { state.A.sortKey = key; state.A.sortDir = key === 'ret1y' || key === 'close' || key === 'chg' ? 'desc' : 'asc'; }
    refreshATable();
    return;
  }
  if (name === 'a-filter'){ state.A.filter = val; refreshATable(); return; }
  if (name === 'row-hsi'){ goScreen('B'); return; }
  if (name === 'open-mvi'){ openMviModal(); return; }
  if (name === 'heat'){
    showTip('<h4><span class="dot"></span>' + el.getAttribute('data-name') + ' · 行业估值</h4>' +
      '<div class="tr"><span>PE-TTM 近 5 年分位均值</span><b>' + el.getAttribute('data-pct') + '%</b></div>' +
      '<div class="tr"><span>样本数</span><b>' + el.getAttribute('data-n') + ' 只指数</b></div>' +
      '<div class="tr"><span>代表指数</span><b>' + el.getAttribute('data-rep') + '</b></div>' +
      '<div class="tnote">行业估值热力 = 行业下所有指数的 PE-TTM 近 5 年分位均值；分位越低越便宜。数据截至 2026-11-27。</div>', e.clientX, e.clientY);
    return;
  }
  if (name === 'b-win'){ state.B.win = Number(val); refreshBChart(); return; }
  if (name === 'b-band'){ state.B.band = !state.B.band; refreshBChart(); return; }
  if (name === 'b-fundsort'){
    var k = el.getAttribute('data-key');
    if (state.B.fundSortKey === k) state.B.fundSortDir = state.B.fundSortDir === 'asc' ? 'desc' : 'asc';
    else { state.B.fundSortKey = k; state.B.fundSortDir = k === 'code' ? 'asc' : 'desc'; }
    refreshBFunds();
    return;
  }
  if (name === 'b-fundexpand'){ state.B.fundOpen = !state.B.fundOpen; refreshBFunds(); return; }
  if (name === 'b-period'){ state.B.period = val; refreshBRisk(); return; }
  if (name === 'c-mode'){
    if (state.C.mode === val) return;
    state.C.mode = val; state.C.menu = '';
    renderScreen();
    return;
  }
  if (name === 'c-select'){
    var menu = $('.dropdown-menu', el.closest('.dropdown'));
    var isOpen = menu.classList.toggle('open');
    el.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    if (isOpen) closeStatusPop();
    return;
  }
  if (name === 'c-pick-portfolio'){ state.C.portfolio = val; renderScreen(); return; }
  if (name === 'c-pick-basket'){ state.C.basket = val; renderScreen(); return; }
  if (name === 'copy-basket'){
    var notice = document.getElementById('basketNotice');

    if (q) showTip('<h4><span class="dot"></span>' + q.name + '象限</h4>' +
      '<div class="tr"><span>资产权重</span><b>' + q.weight + '%</b></div>' +
      '<div class="tr"><span>收益贡献</span><b>' + (q.contrib > 0 ? '+' : '') + q.contrib + 'pp</b></div>' +
      '<div class="tr"><span>象限资产</span><b>' + q.assets + '</b></div>' +
      '<div class="tnote">' + q.more + '</div>', e.clientX, e.clientY);
    return;
  }
  if (name === 'mvi-index'){ state.modal.mviIndex = val; updateMviModal(); return; }
  if (name === 'close-mvi' || name === 'modal-close'){ closeModal(); return; }
  if (name === 'status-toggle'){ showStatus(); return; }
  if (name === 'theme'){
    applyTheme(el.getAttribute('data-theme-val'));
    return;
  }
  if (name === 'notify' || name === 'feedback' || name === 'login' || name === 'rebalance' || name === 'c-save' || name === 'c-new' || name === 'row-basket'){
    var text = name === 'notify' ? '订阅成功后，成分数据上线会通知你。'
      : name === 'feedback' ? '已记录反馈：希望优先补齐 HSI 成分与行业权重。'
      : name === 'login' ? '登录后即可创建、保存与复制篮子。'
      : name === 'rebalance' ? '模拟再平衡：当前偏离 2.3pp 未达 5pp 阈值，无需调仓。'
      : name === 'c-save' ? '保存成功（示例）：参数已同步到「我的组合」。'
      : name === 'c-new' ? '新建流程（示例）：选择模板 → 设置参数 → 运行回测。'
      : '资产详情页建设中（示例）。';
    protoNote(el, text);
    return;
  }
  if (name === 'export'){
    protoNote(el, '已生成 2026-11-27 行情快照（CSV，示例数据 521 只指数）。');
    return;
  }
}
function closeStatusPop(){
  var wrap = document.getElementById('statusWrap');
  if (wrap) wrap.classList.remove('open');
  var btn = document.getElementById('statusBadge');
  if (btn) btn.setAttribute('aria-expanded', 'false');
}
function bindStaticEvents(){
  $$('[data-theme-btn]').forEach(function(b){
    b.addEventListener('click', function(){ applyTheme(b.getAttribute('data-theme-btn')); });
  });
  $$('.screen-nav button').forEach(function(b){
    b.addEventListener('click', function(){ goScreen(b.getAttribute('data-screen')); });
  });
  var demoBtn = document.getElementById('demoBtn');
  if (demoBtn) demoBtn.addEventListener('click', demoLoad);
  document.addEventListener('click', function(e){
    var actEl = e.target.closest('[data-act]');
    if (actEl){ handleAct(actEl.getAttribute('data-act'), actEl, e); return; }
    var statusBtn = e.target.closest('#statusBadge');
    if (statusBtn){ showStatus(); return; }
    if (!e.target.closest('.dropdown')) closeDropdowns();
    if (!e.target.closest('#statusWrap')) closeStatusPop();
  });
  document.addEventListener('mouseover', function(e){
    var cell = e.target.closest('.heat-cell');
    if (cell){
      showTip('<h4><span class="dot"></span>' + cell.getAttribute('data-name') + ' · 行业估值</h4>' +
        '<div class="tr"><span>PE 分位均值</span><b>' + cell.getAttribute('data-pct') + '%</b></div>' +
        '<div class="tr"><span>样本数</span><b>' + cell.getAttribute('data-n') + ' 只指数</b></div>' +
        '<div class="tr"><span>代表指数</span><b>' + cell.getAttribute('data-rep') + '</b></div>' +
        '<div class="tnote">热力 = 行业下所有指数的 PE-TTM 近 5 年分位均值；分位越低越便宜。</div>', e.clientX, e.clientY);
    }
  });
  document.addEventListener('mousemove', function(e){
    var cell = e.target.closest('.heat-cell');
    if (!cell) return;
    var tip = document.getElementById('tip');
    if (tip && tip.classList.contains('show')) showTip(tip.innerHTML, e.clientX, e.clientY);
  });
  document.addEventListener('mouseout', function(e){
    var cell = e.target.closest('.heat-cell');
    if (cell && (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.heat-cell'))) hideTip();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ closeModal(); closeDropdowns(); closeStatusPop(); hideTip(); }
    if (e.key === '1') goScreen('A');
    if (e.key === '2') goScreen('B');
    if (e.key === '3') goScreen('C');
  });
  window.addEventListener('scroll', function(){
    var h = document.getElementById('apphead');
    if (h) h.classList.toggle('scrolled', window.scrollY > 6);
  }, { passive: true });
  window.addEventListener('hashchange', renderScreen);
  window.addEventListener('resize', function(){ hideTip(); });
}
function bindScreenEvents(){ /* delegation-based; kept for renderScreen hook */ }

/* ============================================================
   boot
   ============================================================ */
(function init(){
  initTheme();
  bindStaticEvents();
  bindResize();
  if (!location.hash || location.hash === '#' || location.hash === '#/') {
    try { history.replaceState(null, '', ROUTES.A); } catch(e){ location.hash = ROUTES.A; }
  }
  try {
    var qp = new URLSearchParams(location.search);
    if (qp.get('screen') && ROUTES[qp.get('screen')]) history.replaceState(null, '', ROUTES[qp.get('screen')]);
    if (qp.get('theme') === 'dark' || qp.get('theme') === 'light') applyTheme(qp.get('theme'));
  } catch(e){}
  state.screen = routeId();
  renderScreen();
  try {
    var qp2 = new URLSearchParams(location.search);
    if (qp2.get('modal') === 'mvi') openMviModal();
    if (qp2.get('debug') === '1'){
      setTimeout(function(){
        var lines = ['innerWidth=' + window.innerWidth, 'docScrollWidth=' + document.documentElement.scrollWidth, 'bodyScrollWidth=' + document.body.scrollWidth, 'mainScrollWidth=' + document.getElementById('main').scrollWidth];
        var over = [];
        Array.prototype.slice.call(document.querySelectorAll('body *')).forEach(function(el){
          var r = el.getBoundingClientRect();
          if (r.right > window.innerWidth + 2 && r.width > 30){
            over.push((el.tagName + '.' + (el.className && el.className.baseVal !== undefined ? el.className.baseVal : el.className)).slice(0, 90) + ' | right=' + Math.round(r.right) + ' w=' + Math.round(r.width));
          }
        });
        lines.push('OVERFLOW_COUNT=' + over.length);
        lines = lines.concat(over.slice(0, 60));
        var pre = document.createElement('pre');
        pre.id = 'dbg';
        pre.style.cssText = 'position:fixed;left:0;top:0;z-index:999;background:#fff;color:#000;font:10px monospace;max-width:100%;white-space:pre-wrap;padding:4px';
        pre.textContent = lines.join('\n');
        document.body.appendChild(pre);
      }, 3200);
    }
  } catch(e){}
})();
</script>
