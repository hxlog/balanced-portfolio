<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Balanced Portfolio · 全站 UI 重构原型 · V1 Prologue Refined</title>
<style>
/* ============================================================
   V1 Prologue Refined · tokens
   - sky 主色 / 红涨绿跌 / 完整暗色
   - 三级圆角 control 10 / card 14 / panel 20 + pill
   - 柔和品牌渐变仅用于光晕与强调
   ============================================================ */
:root{
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;

  --bg:#f6f8fb;
  --bg-sunken:#eef3f9;
  --surface:#ffffff;
  --surface-2:#f2f6fa;
  --surface-3:#e7eef6;
  --text:#0f172a;
  --text-2:#5b6b82;
  --text-3:#8a99ad;
  --border:#e4e9f0;
  --border-strong:#cbd5e1;

  --accent:#0284c7;
  --accent-strong:#0369a1;
  --accent-wash:#e8f4fd;
  --accent-line:rgba(2,132,199,.22);
  --pri-grad:linear-gradient(180deg,#0ea5e9,#0284c7);
  --pri-border:#0284c7;
  --pri-fg:#ffffff;

  --up:#dc2626;
  --down:#16a34a;
  --flat:#5b6b82;
  --warn:#d97706;
  --warn-wash:#fff7e6;
  --violet:#8b5cf6;
  --violet-wash:#f3edff;
  --rose:#e11d48;
  --success:#16a34a;

  --brand-grad:linear-gradient(115deg,#c7d2fe,#bae6fd 45%,#fbcfe8);
  --brand-grad-soft:linear-gradient(115deg,rgba(199,210,254,.55),rgba(186,230,253,.6) 45%,rgba(251,207,232,.5));
  --hero-glow:radial-gradient(ellipse 660px 280px at 12% -2%,rgba(186,230,253,.72),transparent 64%),radial-gradient(ellipse 560px 260px at 52% -8%,rgba(199,210,254,.55),transparent 66%),radial-gradient(ellipse 500px 240px at 88% -6%,rgba(251,207,232,.4),transparent 68%);

  --r-control:10px;
  --r-card:14px;
  --r-panel:20px;
  --r-pill:999px;

  --shadow-card:0 1px 2px rgba(15,23,42,.04), 0 8px 24px -18px rgba(15,23,42,.16);
  --shadow-card-hover:0 2px 4px rgba(15,23,42,.05), 0 18px 44px -24px rgba(15,23,42,.30);
  --shadow-glow:0 18px 44px -24px rgba(139,92,246,.32), 0 2px 16px -8px rgba(2,132,199,.18);
  --shadow-pop:0 24px 64px -24px rgba(15,23,42,.32), 0 2px 8px rgba(15,23,42,.06);
  --glow-ring:rgba(2,132,199,.16);

  --dur-fast:150ms;
  --dur-base:200ms;
  --dur-enter:300ms;
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-soft:cubic-bezier(.22,.61,.36,1);

  --chart-grid:rgba(15,23,42,.055);
  --chart-axis:rgba(15,23,42,.14);
  --chart-text:#8a99ad;
  --chart-sky:#0284c7;
  --chart-amber:#d97706;
  --chart-violet:#7c3aed;
  --chart-rose:#e11d48;
  --chart-slate:#94a3b8;
  --chart-teal:#0d9488;
  --zone-low:rgba(22,163,74,.10);
  --zone-mid:rgba(217,119,6,.065);
  --zone-high:rgba(220,38,38,.085);

  --row-hover:rgba(2,132,199,.045);
  --skeleton-base:#edf2f8;
  --skeleton-shine:rgba(255,255,255,.85);
  --glass:rgba(255,255,255,.76);
  --header-h:60px;
  --page-max:1480px;
}

:root[data-theme="dark"]{
  --bg:#0b1220;
  --bg-sunken:#0f1929;
  --surface:#111a2b;
  --surface-2:#16213a;
  --surface-3:#1e2c46;
  --text:#e6edf7;
  --text-2:#a6b4c9;
  --text-3:#6d7c93;
  --border:#22304a;
  --border-strong:#31415f;

  --accent:#38bdf8;
  --accent-strong:#7dd3fc;
  --accent-wash:#0c2a3d;
  --accent-line:rgba(56,189,248,.3);
  --pri-grad:linear-gradient(180deg,#38bdf8,#0ea5e9);
  --pri-border:#38bdf8;
  --pri-fg:#062536;

  --up:#f87171;
  --down:#4ade80;
  --flat:#a6b4c9;
  --warn:#fbbf24;
  --warn-wash:#2a2316;
  --violet:#a78bfa;
  --violet-wash:#241d3a;
  --rose:#fb7185;
  --success:#4ade80;

  --hero-glow:radial-gradient(ellipse 620px 260px at 12% 0%,rgba(14,116,144,.30),transparent 62%),radial-gradient(ellipse 520px 240px at 52% -6%,rgba(76,29,149,.22),transparent 64%),radial-gradient(ellipse 460px 220px at 88% -4%,rgba(131,24,67,.16),transparent 66%);

  --shadow-card:0 1px 2px rgba(0,0,0,.28), 0 12px 30px -20px rgba(0,0,0,.6);
  --shadow-card-hover:0 18px 46px -24px rgba(0,0,0,.75);
  --shadow-glow:0 18px 46px -24px rgba(139,92,246,.35), 0 2px 16px -8px rgba(56,189,248,.22);
  --shadow-pop:0 28px 70px -26px rgba(0,0,0,.8), 0 2px 10px rgba(0,0,0,.35);
  --glow-ring:rgba(56,189,248,.22);

  --chart-grid:rgba(230,237,247,.06);
  --chart-axis:rgba(230,237,247,.16);
  --chart-text:#6d7c93;
  --chart-sky:#38bdf8;
  --chart-amber:#fbbf24;
  --chart-violet:#a78bfa;
  --chart-rose:#fb7185;
  --chart-slate:#64748b;
  --chart-teal:#2dd4bf;
  --zone-low:rgba(74,222,128,.10);
  --zone-mid:rgba(251,191,36,.065);
  --zone-high:rgba(248,113,113,.09);

  --row-hover:rgba(56,189,248,.07);
  --skeleton-base:#16213a;
  --skeleton-shine:rgba(120,160,210,.12);
  --glass:rgba(11,18,32,.72);
}

/* ============================================================
   base
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font:13.5px/1.55 var(--font-sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:clip;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:var(--hero-glow);
  opacity:.9;
}
:root[data-theme="dark"] body::before{opacity:.75}
::selection{background:rgba(2,132,199,.18)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px}
.skip:focus{left:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* numeric */
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.01em}
.up{color:var(--up)!important}
.down{color:var(--down)!important}
.flat{color:var(--flat)!important}
.muted{color:var(--text-3)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}

/* ============================================================
   app header · glass sticky
   ============================================================ */
.apphead{
  position:sticky;
  top:0;
  z-index:50;
  height:var(--header-h);
  background:var(--glass);
  -webkit-backdrop-filter:blur(16px) saturate(1.35);
  backdrop-filter:blur(16px) saturate(1.35);
  border-bottom:1px solid var(--border);
  transition:box-shadow var(--dur-base) var(--ease);
}
.apphead.scrolled{box-shadow:0 10px 30px -24px rgba(15,23,42,.5)}
:root[data-theme="dark"] .apphead.scrolled{box-shadow:0 10px 30px -22px rgba(0,0,0,.8)}
.head-inner{
  max-width:var(--page-max);
  height:100%;
  margin:0 auto;
  padding:0 24px;
  display:flex;
  align-items:center;
  gap:18px;
}
.brand{display:flex;align-items:center;gap:9px;flex:none;border-radius:10px}
.brand-mark{
  width:27px;height:27px;border-radius:9px;display:grid;place-items:center;
  background:var(--brand-grad);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.65), 0 4px 12px -6px rgba(2,132,199,.55);
  color:#0b3a58;font:700 11px/1 var(--font-mono);letter-spacing:-.02em;
}
:root[data-theme="dark"] .brand-mark{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22), 0 4px 14px -6px rgba(56,189,248,.5);color:#04202f}
.brand-name{font-size:14.5px;font-weight:650;letter-spacing:-.02em;white-space:nowrap}
.brand-name .b-dot{color:var(--accent);padding:0 1px}
.brand-tag{font-size:10px;font-weight:600;color:var(--accent-strong);background:var(--accent-wash);border:1px solid var(--accent-line);border-radius:6px;padding:2px 5px;letter-spacing:.02em}
.site-nav{display:flex;align-items:center;gap:1px;margin-left:4px}
.site-nav a{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:var(--r-pill);
  font-size:12.5px;color:var(--text-2);transition:background var(--dur-fast) var(--ease-soft),color var(--dur-fast) var(--ease-soft);
}
.site-nav a:hover{background:var(--accent-wash);color:var(--accent-strong)}
.site-nav a[aria-current="page"]{
  color:var(--accent-strong);font-weight:600;
  background:linear-gradient(115deg,rgba(199,210,254,.38),rgba(186,230,253,.5) 48%,rgba(251,207,232,.34));
  box-shadow:inset 0 0 0 1px rgba(2,132,199,.20);
}
:root[data-theme="dark"] .site-nav a[aria-current="page"]{
  background:linear-gradient(115deg,rgba(76,29,149,.4),rgba(14,116,144,.4) 48%,rgba(131,24,67,.28));
  box-shadow:inset 0 0 0 1px rgba(56,189,248,.26);
}
.head-right{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.screen-nav{
  display:inline-flex;align-items:center;gap:2px;padding:3px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-pill);
}
.screen-nav button{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:0;border-radius:var(--r-pill);
  background:transparent;color:var(--text-2);font-size:11.5px;cursor:pointer;white-space:nowrap;
  transition:background var(--dur-fast),color var(--dur-fast),box-shadow var(--dur-fast);
}
.screen-nav button:hover{color:var(--text)}
.screen-nav button .k{
  font:600 9.5px/1 var(--font-mono);color:var(--text-3);border:1px solid var(--border-strong);
  border-radius:5px;padding:1px 4px;background:var(--surface);
}
.screen-nav button[aria-selected="true"]{
  background:var(--surface);color:var(--text);font-weight:600;
  box-shadow:0 1px 3px rgba(15,23,42,.10), 0 0 0 1px rgba(2,132,199,.10);
}
.screen-nav button[aria-selected="true"] .k{color:var(--accent-strong);border-color:var(--accent-line);background:var(--accent-wash)}
.icon-btn{
  width:32px;height:32px;display:inline-grid;place-items:center;border:1px solid transparent;border-radius:10px;
  background:transparent;color:var(--text-2);cursor:pointer;flex:none;
  transition:background var(--dur-fast),color var(--dur-fast),border-color var(--dur-fast);
}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.icon-btn:active{transform:translateY(.5px)}
.avatar{
  width:29px;height:29px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,#bae6fd,#c7d2fe 55%,#fbcfe8);
  color:#0b3a58;font:700 10.5px/1 var(--font-mono);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.7), 0 2px 8px -3px rgba(15,23,42,.3);
}
:root[data-theme="dark"] .avatar{color:#04202f;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.head-sep{width:1px;height:20px;background:var(--border);margin:0 2px;flex:none}

/* ============================================================
   page shell
   ============================================================ */
.app-main{min-height:calc(100vh - var(--header-h))}
.page{max-width:var(--page-max);margin:0 auto;padding:22px 24px 104px;position:relative}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;position:relative;padding-top:2px}
.page-head::before{
  content:"";position:absolute;left:-24px;right:-24px;top:-34px;height:190px;z-index:-1;pointer-events:none;
  background:var(--hero-glow);filter:blur(2px);opacity:.9;
}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 10.5px/1 var(--font-mono);letter-spacing:.10em;color:var(--accent-strong);text-transform:uppercase}
.eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:var(--brand-grad)}
.page-title{font-size:26px;line-height:1.18;font-weight:660;letter-spacing:-.025em;margin-top:7px}
.page-title .code{font:500 13px/1 var(--font-mono);color:var(--text-3);letter-spacing:0;margin-left:8px;vertical-align:middle}
.page-sub{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:7px;font-size:12px;color:var(--text-2)}
.page-sub .sep{width:3px;height:3px;border-radius:50%;background:var(--border-strong)}
.page-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:4px}
.page-actions .row{display:flex;align-items:center;gap:8px}
.screen-foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-3);line-height:1.7}
.screen-foot b{color:var(--text-2);font-weight:600}
.screen-foot .foot-links{display:flex;gap:12px;flex-wrap:wrap}
.screen-foot a{color:var(--text-2)}
.screen-foot a:hover{color:var(--accent-strong)}

/* ============================================================
   buttons / segmented / tabs / pills
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:32px;padding:0 12px;border-radius:var(--r-control);
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background var(--dur-fast) var(--ease-soft),color var(--dur-fast),border-color var(--dur-fast),box-shadow var(--dur-fast),transform var(--dur-fast);
}
.btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}
.btn:active{transform:translateY(.5px)}
.btn svg{flex:none}
.btn-pri{background:var(--pri-grad);border-color:var(--pri-border);color:var(--pri-fg);font-weight:600;box-shadow:0 1px 2px rgba(2,132,199,.28), inset 0 1px 0 rgba(255,255,255,.22)}
.btn-pri:hover{filter:brightness(1.04);color:var(--pri-fg);border-color:var(--pri-border);background:var(--pri-grad)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent;color:var(--text)}
.btn-sm{height:27px;padding:0 9px;font-size:11.5px;border-radius:8px;gap:5px}
.btn-lg{height:36px;padding:0 15px;font-size:12.5px;border-radius:11px}
.btn[disabled],.btn.is-disabled{opacity:.55;cursor:not-allowed}
.btn .count{font:600 10.5px/1 var(--font-mono);background:var(--surface-2);border-radius:5px;padding:2px 5px;color:var(--text-2)}

.seg{display:inline-flex;align-items:center;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-control)}
.seg button{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:25px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--text-2);
  font-size:11.5px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background var(--dur-fast) var(--ease-soft),color var(--dur-fast),box-shadow var(--dur-fast);
}
.seg button:hover{color:var(--text)}
.seg button[aria-selected="true"]{
  background:var(--surface);color:var(--text);font-weight:600;
  box-shadow:0 1px 3px rgba(15,23,42,.10), 0 0 0 1px rgba(2,132,199,.10);
}
.seg button .dot{width:5px;height:5px;border-radius:50%;background:var(--border-strong)}
.seg button[aria-selected="true"] .dot{background:var(--accent)}
.seg-sm button{height:23px;padding:0 8px;font-size:11px}
.seg-lg button{height:28px;padding:0 12px;font-size:12px}

.tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--border)}
.tabs button{
  position:relative;display:inline-flex;align-items:center;gap:6px;
  border:0;background:transparent;padding:10px 13px;margin-bottom:-1px;
  color:var(--text-2);font-size:12.5px;font-weight:500;cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color var(--dur-fast);white-space:nowrap;
}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
.tabs button .mini-pct{font:500 10.5px/1 var(--font-mono);color:var(--text-3);background:var(--surface-2);border-radius:5px;padding:2px 5px}
.tabs button[aria-selected="true"] .mini-pct{color:var(--accent-strong);background:var(--accent-wash)}

.pill{
  display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;
  border-radius:var(--r-pill);font-size:10.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap;
}
.pill .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.pill-low{color:#15803d;background:rgba(22,163,74,.10);box-shadow:inset 0 0 0 1px rgba(22,163,74,.18)}
.pill-mid{color:#b45309;background:rgba(217,119,6,.10);box-shadow:inset 0 0 0 1px rgba(217,119,6,.18)}
.pill-high{color:#b91c1c;background:rgba(220,38,38,.09);box-shadow:inset 0 0 0 1px rgba(220,38,38,.16)}
.pill-sky{color:var(--accent-strong);background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--accent-line)}
.pill-violet{color:#6d28d9;background:rgba(139,92,246,.10);box-shadow:inset 0 0 0 1px rgba(139,92,246,.18)}
.pill-muted{color:var(--text-2);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)}
.pill-warn{color:#92400e;background:var(--warn-wash);box-shadow:inset 0 0 0 1px rgba(217,119,6,.22)}
:root[data-theme="dark"] .pill-low{color:#4ade80;background:rgba(74,222,128,.12);box-shadow:inset 0 0 0 1px rgba(74,222,128,.2)}
:root[data-theme="dark"] .pill-mid{color:#fbbf24;background:rgba(251,191,36,.12);box-shadow:inset 0 0 0 1px rgba(251,191,36,.2)}
:root[data-theme="dark"] .pill-high{color:#f87171;background:rgba(248,113,113,.12);box-shadow:inset 0 0 0 1px rgba(248,113,113,.2)}
:root[data-theme="dark"] .pill-violet{color:#c4b5fd;background:rgba(167,139,250,.13);box-shadow:inset 0 0 0 1px rgba(167,139,250,.22)}
:root[data-theme="dark"] .pill-warn{color:#fbbf24;background:rgba(251,191,36,.10)}
.badge-dot{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-2)}

.chip{
  display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:var(--r-pill);
  font-size:11px;color:var(--text-2);background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--border);
}
.chip .cdot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}
.chip b{font-weight:600;color:var(--text)}
.chip:hover{color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong)}

.info{
  width:16px;height:16px;border-radius:50%;border:1px solid var(--border-strong);background:transparent;
  color:var(--text-3);font:600 9.5px/1 var(--font-mono);display:inline-grid;place-items:center;
  cursor:help;padding:0;flex:none;transition:color var(--dur-fast),border-color var(--dur-fast),background var(--dur-fast);
}
.info:hover,.info:focus-visible{color:var(--accent-strong);border-color:var(--accent);background:var(--accent-wash)}

/* ============================================================
   cards
   ============================================================ */
.card{
  position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  transition:box-shadow var(--dur-base) var(--ease),border-color var(--dur-base),transform var(--dur-base) var(--ease);
}
.card.lift:hover{box-shadow:var(--shadow-card-hover);border-color:var(--border-strong);transform:translateY(-1px)}
.card.spot{isolation:isolate;overflow:hidden}
.card.spot::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:0;pointer-events:none;opacity:0;
  background:radial-gradient(260px 200px at var(--spot-x,50%) var(--spot-y,50%),rgba(186,230,253,.32),rgba(199,210,254,.16) 46%,transparent 72%);
  transition:opacity var(--dur-base) var(--ease);
}
.card.spot:hover::before{opacity:1}
:root[data-theme="dark"] .card.spot::before{background:radial-gradient(260px 200px at var(--spot-x,50%) var(--spot-y,50%),rgba(56,189,248,.16),rgba(167,139,250,.10) 46%,transparent 72%)}
.card.spot > *{position:relative;z-index:1}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:15px 16px 0}
.card-head.tight{padding-bottom:0}
.card-title{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:650;letter-spacing:-.01em;line-height:1.35}
.card-title .badge-sup{font:600 9.5px/1 var(--font-mono);color:var(--accent-strong);background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--accent-line);border-radius:5px;padding:2px 5px}
.card-sub{font-size:11.5px;color:var(--text-3);margin-top:4px;line-height:1.6}
.card-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.card-body{padding:13px 16px 16px;position:relative}
.card-head + .card-body{padding-top:12px}
.card-body.is-loading{min-height:120px}
.subbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:8px 16px 0;border-top:1px solid transparent}
.card-flush .card-body{padding:0}
.card-body .tbl-wrap{margin:0 -1px}
.section-stack{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}
.grid-2e{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

/* ============================================================
   data freshness / status
   ============================================================ */
.status-wrap{position:relative}
.status-badge{
  display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 11px;
  border:1px solid var(--border);border-radius:var(--r-control);background:var(--surface);
  color:var(--text-2);font-size:11.5px;cursor:pointer;
  box-shadow:var(--shadow-card);transition:border-color var(--dur-fast),box-shadow var(--dur-fast),color var(--dur-fast);
}
.status-badge:hover{border-color:var(--border-strong);color:var(--text)}
.status-badge[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow-ring)}
.status-badge .live-dot{position:relative;width:7px;height:7px;border-radius:50%;background:var(--success);flex:none;box-shadow:0 0 0 3px rgba(22,163,74,.13)}
.status-badge .live-dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid rgba(22,163,74,.4);animation:pulse-dot 2.4s var(--ease) infinite}
.status-badge b{color:var(--text);font-weight:600}
.status-badge .chev{transition:transform var(--dur-base)}
.status-badge[aria-expanded="true"] .chev{transform:rotate(180deg)}
@keyframes pulse-dot{0%{transform:scale(.8);opacity:.9}70%{transform:scale(1.9);opacity:0}100%{transform:scale(.8);opacity:0}}
.popover{
  position:absolute;right:0;top:calc(100% + 8px);width:356px;z-index:60;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-pop);
  padding:14px;opacity:0;transform:translateY(-5px) scale(.99);pointer-events:none;
  transition:opacity var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease);
}
.status-wrap:hover .popover,.status-wrap:focus-within .popover,.status-wrap.open .popover{opacity:1;transform:none;pointer-events:auto}
.popover-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.popover-title{font-size:12.5px;font-weight:650;display:flex;align-items:center;gap:7px}
.popover-sub{font-size:10.5px;color:var(--text-3);margin-top:3px;line-height:1.5}
.popover-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:11.5px}
.popover-row:last-of-type{border-bottom:0}
.popover-row .pname{color:var(--text-2);flex:1;min-width:0}
.popover-row .pdate{font-family:var(--font-mono);font-size:11px;color:var(--text);font-variant-numeric:tabular-nums}
.popover-row .pstate{font-size:10px;color:var(--text-3);min-width:66px;text-align:right}
.popover-row .ok{width:6px;height:6px;border-radius:50%;background:var(--success);flex:none}
.popover-row .late{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none}
.popover-note{margin-top:10px;padding:8px 9px;border-radius:8px;background:var(--surface-2);font-size:10.5px;line-height:1.6;color:var(--text-2)}
.popover-note b{color:var(--text)}

/* ============================================================
   tooltip
   ============================================================ */
.tip{
  position:fixed;left:0;top:0;z-index:200;max-width:330px;padding:10px 12px;
  background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;
  box-shadow:var(--shadow-pop);font-size:11.5px;line-height:1.65;color:var(--text);
  pointer-events:none;opacity:0;transform:translate(-50%,-100%) translateY(-10px);
  transition:opacity var(--dur-fast) var(--ease);
}
.tip.show{opacity:1}
.tip.below{transform:translate(-50%,0) translateY(14px)}
.tip h4{font-size:11.5px;font-weight:650;margin:0 0 6px;display:flex;align-items:center;gap:6px}
.tip h4 .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.tip .tr{display:flex;justify-content:space-between;gap:20px;color:var(--text-2);line-height:1.75}
.tip .tr b{color:var(--text);font-weight:600;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tip .tdiv{height:1px;background:var(--border);margin:7px 0}
.tip .tnote{color:var(--text-3);font-size:10.5px;line-height:1.6;margin-top:6px}
.tip .tformula{font-family:var(--font-mono);font-size:10.5px;line-height:1.75;color:var(--text-2);margin-top:5px;display:flex;flex-direction:column;gap:3px}
.tip .tformula b{color:var(--text);font-weight:600}
.tip code{font-family:var(--font-mono);font-size:10.5px;background:var(--surface-2);border-radius:4px;padding:1px 4px;color:var(--accent-strong)}

/* ============================================================
   tables
   ============================================================ */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);scrollbar-width:thin}
.tbl-wrap::-webkit-scrollbar{height:8px}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:4px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.tbl th{
  padding:9px 12px;background:var(--surface-2);color:var(--text-3);
  font-size:10.5px;font-weight:600;letter-spacing:.02em;text-align:right;
  border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1;
}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th.sortable{cursor:pointer;user-select:none;transition:color var(--dur-fast)}
.tbl th.sortable:hover{color:var(--text-2)}
.tbl th .caret{display:inline-block;margin-left:3px;font-size:8px;color:var(--text-3);vertical-align:1px}
.tbl th.sorted{color:var(--accent-strong)}
.tbl th.sorted .caret{color:var(--accent)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;color:var(--text)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background var(--dur-fast)}
.tbl tbody tr:hover{background:var(--row-hover)}
.tbl tr.clickable{cursor:pointer}
.tbl .asset-name{display:flex;flex-direction:column;gap:1px;text-align:left}
.tbl .asset-name b{font-weight:600;font-size:12px;color:var(--text)}
.tbl .asset-name span{font:500 10px/1.3 var(--font-mono);color:var(--text-3);letter-spacing:.01em}
.tbl .cat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-2)}
.tbl .cat i{width:5px;height:5px;border-radius:2px;background:var(--border-strong);display:inline-block}
.tbl .cat.c-stock i{background:var(--accent)}
.tbl .cat.c-bond i{background:var(--violet)}
.tbl .cat.c-commodity i{background:var(--chart-amber)}
.tbl .cat.c-overseas i{background:var(--chart-teal)}
.tbl .row-act{color:var(--text-3);font-size:11px;transition:color var(--dur-fast)}
.tbl tr:hover .row-act{color:var(--accent-strong)}
.pct-bar-cell{display:inline-flex;align-items:center;justify-content:flex-end;gap:7px;min-width:82px}
.pct-bar-cell .pb{width:38px;height:4px;border-radius:3px;background:var(--surface-3);overflow:hidden;flex:none}
.pct-bar-cell .pb i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.pct-bar-cell.low .pb i{background:var(--success)}
.pct-bar-cell.mid .pb i{background:var(--warn)}
.pct-bar-cell.high .pb i{background:var(--up)}
.tbl-note{padding:9px 12px;font-size:10.5px;color:var(--text-3);border-top:1px dashed var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tbl-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ============================================================
   KPI
   ============================================================ */
.kpi-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{
  position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);
  padding:13px 14px 12px;box-shadow:var(--shadow-card);overflow:hidden;min-width:0;
  transition:box-shadow var(--dur-base) var(--ease),transform var(--dur-base) var(--ease),border-color var(--dur-base);
}
.kpi:hover{box-shadow:var(--shadow-card-hover);transform:translateY(-1px);border-color:var(--border-strong)}
.kpi .k-label{font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:26px;line-height:1.1;font-weight:650;letter-spacing:-.035em;margin-top:7px;white-space:nowrap}
.kpi .k-val .unit{font-size:13px;font-weight:500;color:var(--text-3);margin-left:2px;letter-spacing:0}
.kpi .k-sub{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:10.5px;color:var(--text-3);min-height:14px;white-space:nowrap}
.kpi .k-sub b{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k-spark{position:absolute;right:10px;bottom:9px;width:76px;height:24px;opacity:.9;pointer-events:none}
.kpi.k-spark-wide .k-spark{width:64px}
.kpi .k-bg{position:absolute;right:-24px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--brand-grad-soft);opacity:.35;pointer-events:none;filter:blur(2px)}
:root[data-theme="dark"] .kpi .k-bg{opacity:.18}
.kpi .k-val .up,.kpi .k-val .down{font:inherit}

/* ============================================================
   charts
   ============================================================ */
.chart{position:relative;width:100%;transition:opacity var(--dur-fast) var(--ease-soft)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--chart-grid);stroke-width:1;shape-rendering:crispEdges}
.chart .axis{stroke:var(--chart-axis);stroke-width:1;shape-rendering:crispEdges}
.chart .tick{fill:var(--chart-text);font:500 9.5px/1 var(--font-mono);letter-spacing:0}
.chart .tick--end{font-size:9px}
.chart .lbl{fill:var(--text-2);font:600 10px/1 var(--font-sans)}
.chart .lbl-strong{fill:var(--text);font:600 10.5px/1 var(--font-sans)}
.chart .lbl-faint{fill:var(--chart-text);font:500 9.5px/1 var(--font-sans)}
.chart .ref{stroke-dasharray:3 4;stroke-width:1}
.chart .ref-low{stroke:var(--success)}
.chart .ref-mid{stroke:var(--chart-slate)}
.chart .ref-high{stroke:var(--up)}
.chart .line-sky{fill:none;stroke:var(--chart-sky);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.chart .line-amber{fill:none;stroke:var(--chart-amber);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.chart .line-violet{fill:none;stroke:var(--chart-violet);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.chart .line-rose{fill:none;stroke:var(--chart-rose);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.chart .line-dash{fill:none;stroke-width:1.5;stroke-dasharray:5 4;stroke-linecap:round}
.chart .area-sky{fill:url(#gradSky)}
.chart .area-violet{fill:url(#gradViolet)}
.chart .zone-low{fill:var(--zone-low)}
.chart .zone-mid{fill:var(--zone-mid)}
.chart .zone-high{fill:var(--zone-high)}
.chart .dot-current{fill:var(--chart-sky);stroke:var(--surface);stroke-width:2}
.chart .halo{fill:var(--chart-sky);opacity:.16}
.chart .cross{stroke:var(--text-3);stroke-width:1;stroke-dasharray:3 3;opacity:0;pointer-events:none}
.chart .hover-dot{fill:var(--chart-sky);stroke:var(--surface);stroke-width:1.5;opacity:0}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .bar{fill:var(--chart-sky);opacity:.82;transition:opacity var(--dur-fast)}
.chart .bar:hover{opacity:1}
.chart .bar-violet{fill:var(--chart-violet);opacity:.78}
.chart .bar-track{fill:var(--surface-3);opacity:.7}
.chart .bub{fill:var(--chart-sky);opacity:.42;stroke:var(--chart-sky);stroke-width:.8;transition:opacity var(--dur-fast)}
.chart .bub:hover{opacity:.85}
.chart .bub.q-good{fill:var(--success);stroke:var(--success);opacity:.45}
.chart .bub.q-warn{fill:var(--warn);stroke:var(--warn);opacity:.42}
.chart .bub.q-bad{fill:var(--up);stroke:var(--up);opacity:.38}
.chart .bub.q-neutral{fill:var(--chart-sate);stroke:var(--chart-slate);opacity:.38}
.chart .fit-line{stroke:var(--chart-violet);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.chart .median{stroke:var(--chart-slate);stroke-width:1;stroke-dasharray:2 3;opacity:.55}
.chart .wlabel{fill:var(--text-3);font:600 9px/1 var(--font-mono)}
.chart-empty{display:flex;align-items:center;justify-content:center;height:180px;color:var(--text-3);font-size:12px}

.legend{display:flex;align-items:center;flex-wrap:wrap;gap:12px;font-size:10.5px;color:var(--text-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.legend i.line{height:0;width:14px;border-top:2px solid var(--chart-sky);border-radius:0}
.legend i.dash{height:0;width:14px;border-top:2px dashed var(--chart-amber);border-radius:0}
.legend i.zone{width:12px;height:8px;border-radius:2px}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--text-2);margin-bottom:6px}

/* ============================================================
   skeleton
   ============================================================ */
.sk{display:block;border-radius:6px;background:var(--skeleton-base);position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--skeleton-shine),transparent);transform:translateX(-100%);animation:shimmer 1.4s linear infinite}
.sk-line{height:10px;border-radius:5px}
.sk-num{height:30px;border-radius:8px}
.sk-block{width:100%}
.sk-circle{border-radius:50%}
.sk-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.sk-band{display:grid;grid-template-columns:1.65fr 1fr;gap:18px;padding-top:4px}
.sk-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.sk-chart{height:260px;border-radius:12px;width:100%}
@keyframes shimmer{100%{transform:translateX(100%)}}
.card-body.is-loading{animation:none}
.card-body.is-loading .sk-line:nth-child(2n){opacity:.82}
.card-body.is-ready{animation:reveal-rise var(--dur-enter) var(--ease) both}
@keyframes reveal-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-body.swap{animation:soft-fade var(--dur-fast) var(--ease-soft)}
@keyframes soft-fade{from{opacity:.35}to{opacity:1}}

/* ============================================================
   empty state
   ============================================================ */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:34px 22px;border:1px dashed var(--border-strong);border-radius:12px;
  background:linear-gradient(180deg,var(--surface-2),transparent 90%);
}
.empty .empty-ico{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:13px;
  background:var(--brand-grad-soft);color:var(--accent-strong);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5), 0 8px 20px -14px rgba(2,132,199,.5);
}
:root[data-theme="dark"] .empty .empty-ico{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.empty h3{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.empty p{max-width:440px;margin-top:6px;font-size:11.5px;line-height:1.7;color:var(--text-2)}
.empty .empty-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.empty .empty-meta{margin-top:10px;font:500 10px/1.6 var(--font-mono);color:var(--text-3)}

/* ============================================================
   modal
   ============================================================ */
.modal-root{position:fixed;inset:0;z-index:120;display:none}
.modal-root.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(9,15,28,.48);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade-in var(--dur-base) var(--ease)}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.modal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(1000px,calc(100vw - 40px));max-height:calc(100vh - 40px);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-panel);
  box-shadow:var(--shadow-pop);display:flex;flex-direction:column;overflow:hidden;
  animation:modal-in var(--dur-enter) var(--ease);
}
@keyframes modal-in{from{opacity:0;transform:translate(-50%,-48%) scale(.985)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:17px 20px 14px;border-bottom:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:660;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.modal-sub{font-size:11.5px;color:var(--text-3);margin-top:4px}
.modal-body{padding:14px 20px 20px;overflow:auto}
.modal-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 20px;border-top:1px solid var(--border);font-size:10.5px;color:var(--text-3);flex-wrap:wrap}
.modal-close{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:grid;place-items:center;cursor:pointer}
.modal-close:hover{background:var(--surface-2);color:var(--text)}

/* ============================================================
   dock · fixed bottom-right
   ============================================================ */
.dock{
  position:fixed;right:18px;bottom:18px;z-index:110;display:flex;align-items:center;gap:9px;
  padding:6px 6px 6px 11px;border-radius:14px;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--border);box-shadow:0 18px 48px -22px rgba(15,23,42,.38), 0 1px 2px rgba(15,23,42,.05);
}
:root[data-theme="dark"] .dock{box-shadow:0 20px 52px -22px rgba(0,0,0,.85)}
.dock .dock-label{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--text-3);text-transform:uppercase}
.theme-seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border)}
.theme-seg button{
  display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 8px;border:0;border-radius:7px;
  background:transparent;color:var(--text-3);font-size:10.5px;font-weight:600;cursor:pointer;
  transition:background var(--dur-fast),color var(--dur-fast),box-shadow var(--dur-fast);
}
.theme-seg button:hover{color:var(--text)}
.theme-seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.demo-btn{
  display:inline-flex;align-items:center;gap:6px;height:29px;padding:0 11px;border:0;border-radius:9px;
  background:var(--accent);color:#fff;font-size:11px;font-weight:600;cursor:pointer;
  box-shadow:0 1px 2px rgba(2,132,199,.32), inset 0 1px 0 rgba(255,255,255,.2);
  transition:filter var(--dur-fast),transform var(--dur-fast);
}
:root[data-theme="dark"] .demo-btn{color:#062536}
.demo-btn:hover{filter:brightness(1.06)}
.demo-btn:active{transform:translateY(.5px)}
.demo-btn svg{transition:transform .5s var(--ease)}
.demo-btn.loading svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   screen A · valuation band
   ============================================================ */
.band-head{display:block;padding:15px 16px 0}
.band-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.band-tabs{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:4px;flex-wrap:wrap}
.band-tabs .tabs{flex:1;min-width:280px;border-bottom-color:var(--border)}
.band-tabs .tabs .mini-pct{display:none}
.band-status{display:flex;align-items:center;gap:8px;padding-bottom:9px;font-size:11px;color:var(--text-3);white-space:nowrap}
.band-grid{display:grid;grid-template-columns:minmax(0,1fr) 318px;gap:20px}
.band-main{min-width:0}
.cur-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.cur-label{font-size:11px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:6px}
.cur-val{display:flex;align-items:baseline;gap:3px;margin-top:2px}
.cur-val .num{font-size:34px;line-height:1;font-weight:650;letter-spacing:-.04em}
.cur-val .unit{font-size:14px;font-weight:500;color:var(--text-3)}
.cur-meta{display:flex;align-items:center;gap:9px;padding-bottom:3px;flex-wrap:wrap}
.cur-meta .mini{font-size:10.5px;color:var(--text-3)}
.cur-meta .mini b{font-family:var(--font-mono);color:var(--text);font-weight:600}
.band-chart-hold{margin-top:10px}
.band-legend{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.gauge-block{margin-top:12px;padding-top:11px;border-top:1px dashed var(--border)}
.gauge-rail{position:relative;height:9px;border-radius:5px;background:linear-gradient(90deg,rgba(22,163,74,.28),rgba(245,158,11,.22) 50%,rgba(220,38,38,.26));box-shadow:inset 0 0 0 1px var(--border)}
.gauge-rail .gseg{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--surface);box-shadow:0 0 0 1px var(--border-strong)}
.gauge-ptr{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);transform:translate(-50%,-50%);box-shadow:0 2px 8px -2px rgba(2,132,199,.5);z-index:2}
.gauge-ptr::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.gauge-labels{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:9.5px;color:var(--text-3);font-family:var(--font-mono)}
.gauge-labels b{color:var(--text-2);font-weight:600}
.gauge-labels span{display:inline-flex;flex-direction:column;gap:1px}
.gauge-labels span:nth-child(2),.gauge-labels span:nth-child(3),.gauge-labels span:nth-child(4){align-items:center}
.gauge-labels span:last-child{align-items:flex-end}
.band-rail{border-left:1px solid var(--border);padding-left:16px;display:flex;flex-direction:column;gap:7px;min-width:0}
.rail-title{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;color:var(--text-2);padding-bottom:6px}
.rail-title .hint{font-weight:400;font-size:10px;color:var(--text-3)}
.metric-row{
  display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:8px;align-items:center;
  padding:8px 9px;border:1px solid transparent;border-radius:10px;background:transparent;cursor:pointer;
  text-align:left;transition:background var(--dur-fast),border-color var(--dur-fast),box-shadow var(--dur-fast);
}
.metric-row:hover{background:var(--surface-2)}
.metric-row[aria-selected="true"]{background:var(--accent-wash);border-color:var(--accent-line);box-shadow:0 1px 2px rgba(2,132,199,.08)}
.metric-row .mr-name{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px;color:var(--text)}
.metric-row .mr-name i{width:6px;height:6px;border-radius:2px;display:inline-block;flex:none}
.metric-row .mr-sub{font-size:9.5px;color:var(--text-3);margin-top:2px;display:flex;gap:6px}
.metric-row .mr-sub b{font-family:var(--font-mono);color:var(--text-2);font-weight:600}
.metric-row .mr-spark{width:70px;height:22px}
.metric-row .mr-val{font:600 13px/1 var(--font-mono);letter-spacing:-.02em;text-align:right}
.metric-row .mr-pct{font:500 9.5px/1 var(--font-mono);color:var(--text-3);text-align:right;margin-top:3px}
.rail-note{font-size:10px;line-height:1.6;color:var(--text-3);margin-top:auto;padding-top:8px;border-top:1px dashed var(--border)}
.band-skel{display:grid;grid-template-columns:minmax(0,1fr) 318px;gap:20px}
.band-skel .sk-left,.band-skel .sk-right{display:flex;flex-direction:column;gap:10px}

/* ============================================================
   screen A · MVI
   ============================================================ */
.mvi-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px}
.mvi-main{min-width:0;border-right:1px solid var(--border);padding-right:20px}
.mvi-val-row{display:flex;align-items:flex-end;gap:11px;flex-wrap:wrap}
.mvi-big{font-family:var(--font-mono);font-size:40px;line-height:1;font-weight:650;letter-spacing:-.045em}
.mvi-vs{font-size:10.5px;color:var(--text-3);padding-bottom:5px;line-height:1.5}
.mvi-vs b{font-family:var(--font-mono);display:block;color:var(--down);font-weight:600}
.zone-bar{position:relative;height:10px;margin-top:14px;border-radius:5px;background:linear-gradient(90deg,rgba(22,163,74,.30),rgba(245,158,11,.22) 38%,rgba(245,158,11,.22) 62%,rgba(220,38,38,.26));box-shadow:inset 0 0 0 1px var(--border)}
.zone-bar .zptr{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);transform:translate(-50%,-50%);z-index:2;box-shadow:0 1px 6px -1px rgba(15,23,42,.4)}
.zone-bar .zptr::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.zone-scale{display:flex;justify-content:space-between;font:500 9px/2 var(--font-mono);color:var(--text-3);margin-top:2px}
.zone-scale b{color:var(--text-2);font-weight:600}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.score{padding:10px 11px;border:1px solid var(--border);border-radius:11px;background:var(--surface-2)}
.score .sc-top{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--text-2);font-weight:600}
.score .sc-val{font:650 19px/1.2 var(--font-mono);letter-spacing:-.03em;margin-top:5px}
.score .sc-bar{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.score .sc-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#7dd3fc,var(--accent))}
.score.warn .sc-bar i{background:linear-gradient(90deg,#fde68a,var(--warn))}
.score .sc-note{font-size:9px;color:var(--text-3);margin-top:6px;line-height:1.5}
.factor-list{margin-top:13px}
.factor-head{display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);margin-bottom:6px}
.factor{display:grid;grid-template-columns:44px minmax(0,1fr) 46px;gap:8px;align-items:center;padding:3px 0}
.factor .f-name{font-size:10.5px;color:var(--text-2);display:flex;align-items:center;gap:5px}
.factor .f-name i{width:5px;height:5px;border-radius:1.5px;background:var(--accent);flex:none}
.factor .f-bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.factor .f-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,rgba(14,165,233,.55),var(--accent))}
.factor .f-val{font:600 10.5px/1 var(--font-mono);text-align:right;color:var(--text)}
.factor-note{font-size:9.5px;line-height:1.6;color:var(--text-3);margin-top:9px}
.mvi-chart-col{min-width:0}
.mvi-chart-col .chart-head{font-size:11px;color:var(--text-2)}
.mvi-skel{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px}

/* ============================================================
   screen A · industry heat
   ============================================================ */
.heat-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.heat-cell{
  position:relative;border:1px solid var(--border);border-radius:11px;padding:10px 11px 9px;
  text-align:left;cursor:pointer;overflow:hidden;min-width:0;
  transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast),border-color var(--dur-fast);
}
.heat-cell:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover);border-color:var(--border-strong);z-index:2}
.heat-cell .hc-name{font-size:11px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:4px;white-space:nowrap}
.heat-cell .hc-pct{font:650 17px/1.2 var(--font-mono);letter-spacing:-.03em;margin-top:6px}
.heat-cell .hc-pct span{font:500 9px/1 var(--font-mono);color:var(--text-3);margin-left:2px}
.heat-cell .hc-samples{font-size:9px;color:var(--text-3);margin-top:3px}
.heat-cell .hc-pct{margin-top:7px}
.heat-cell .hc-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--surface-3)}
.heat-cell .hc-bar i{display:block;height:100%}
.heat-cell.low-1{background:rgba(22,163,74,.055)}
.heat-cell.low-2{background:rgba(22,163,74,.10)}
.heat-cell.mid-1{background:rgba(245,158,11,.05)}
.heat-cell.mid-2{background:rgba(245,158,11,.095)}
.heat-cell.high-1{background:rgba(220,38,38,.05)}
.heat-cell.high-2{background:rgba(220,38,38,.09)}
.heat-cell.low-1 .hc-bar i,.heat-cell.low-2 .hc-bar i{background:var(--success)}
.heat-cell.mid-1 .hc-bar i,.heat-cell.mid-2 .hc-bar i{background:var(--warn)}
.heat-cell.high-1 .hc-bar i,.heat-cell.high-2 .hc-bar i{background:var(--up)}
:root[data-theme="dark"] .heat-cell.low-1{background:rgba(74,222,128,.06)}
:root[data-theme="dark"] .heat-cell.low-2{background:rgba(74,222,128,.11)}
:root[data-theme="dark"] .heat-cell.mid-1{background:rgba(251,191,36,.05)}
:root[data-theme="dark"] .heat-cell.mid-2{background:rgba(251,191,36,.09)}
:root[data-theme="dark"] .heat-cell.high-1{background:rgba(248,113,113,.06)}
:root[data-theme="dark"] .heat-cell.high-2{background:rgba(248,113,113,.11)}
.heat-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:11px;flex-wrap:wrap}
.heat-legend{display:flex;align-items:center;gap:7px;font-size:9.5px;color:var(--text-3)}
.heat-legend .hl-bar{width:130px;height:7px;border-radius:4px;background:linear-gradient(90deg,rgba(22,163,74,.7),rgba(245,158,11,.7) 50%,rgba(220,38,38,.7));box-shadow:inset 0 0 0 1px var(--border)}
.heat-legend b{font-weight:500;color:var(--text-2)}
.heat-summary{display:flex;gap:6px;align-items:center}
.heat-summary .pill{height:20px;font-size:10px;padding:0 7px}

/* ============================================================
   screen A · dividend attractiveness
   ============================================================ */
.div-grid{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:20px}
.div-chart-col{min-width:0}
.div-rail{border-left:1px solid var(--border);padding-left:16px;display:flex;flex-direction:column;min-width:0}
.div-rail .rail-title{font-size:11px;font-weight:600;color:var(--text-2)}
.div-rail .rail-sub{font-size:9.5px;color:var(--text-3);margin-top:2px}
.div-top-list{margin-top:9px;display:flex;flex-direction:column;gap:2px}
.div-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:7px 6px;border-radius:8px;align-items:center;transition:background var(--dur-fast)}
.div-item:hover{background:var(--surface-2)}
.div-item .di-name{font-size:11px;font-weight:600;display:flex;flex-direction:column;gap:1px;min-width:0}
.div-item .di-name span{font:500 9px/1.3 var(--font-mono);color:var(--text-3)}
.div-item .di-vals{text-align:right;display:flex;flex-direction:column;gap:1px}
.div-item .di-vals b{font:650 11.5px/1 var(--font-mono);color:var(--up)}
.div-item .di-vals span{font:500 9px/1.3 var(--font-mono);color:var(--text-3)}
.div-note{margin-top:auto;padding-top:9px;border-top:1px dashed var(--border);font-size:9.5px;line-height:1.65;color:var(--text-3)}
.div-note b{color:var(--text-2)}

/* ============================================================
   screen B · detail
   ============================================================ */
.breadcrumb{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-3);margin-bottom:9px}
.breadcrumb a{color:var(--text-2)}
.breadcrumb a:hover{color:var(--accent-strong)}
.breadcrumb .bc-sep{color:var(--border-strong)}
.b-page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:22px;flex-wrap:wrap;align-items:flex-end}
.b-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.b-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.b-quote{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.b-quote .bq-main{text-align:right}
.b-quote .bq-price{font-family:var(--font-mono);font-size:31px;line-height:1;font-weight:650;letter-spacing:-.04em;display:flex;align-items:baseline;gap:8px;justify-content:flex-end}
.b-quote .bq-price .up,.b-quote .bq-price .down{font:inherit;font-size:31px}
.b-quote .bq-sub{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:5px;font-size:10.5px;color:var(--text-3);font-family:var(--font-mono)}
.b-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:13px 14px 12px;box-shadow:var(--shadow-card);position:relative;overflow:hidden;transition:box-shadow var(--dur-base),transform var(--dur-base),border-color var(--dur-base)}
.metric-card:hover{box-shadow:var(--shadow-card-hover);transform:translateY(-1px);border-color:var(--border-strong)}
.metric-card .mc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--text-2)}
.metric-card .mc-value{display:flex;align-items:baseline;gap:4px;margin-top:5px}
.metric-card .mc-value .num{font-size:27px;line-height:1.05;font-weight:650;letter-spacing:-.04em}
.metric-card .mc-value .unit{font-size:12px;color:var(--text-3);font-weight:500}
.metric-card .mc-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9.5px;color:var(--text-3);margin-top:5px;font-family:var(--font-mono)}
.pct-track{position:relative;height:7px;border-radius:4px;background:linear-gradient(90deg,rgba(22,163,74,.25),rgba(245,158,11,.2) 50%,rgba(220,38,38,.24));box-shadow:inset 0 0 0 1px var(--border);margin-top:10px}
.pct-track .pt-ptr{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(15,23,42,.35)}
.pct-track .pt-ptr::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--accent)}
.pct-ends{display:flex;justify-content:space-between;font-size:8.5px;color:var(--text-3);font-family:var(--font-mono);margin-top:3px}
.b-main-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.funds-top{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.funds-bar{min-width:0}
.funds-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fund-stat{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 10px}
.fund-stat .fs-k{font-size:9.5px;color:var(--text-3)}
.fund-stat .fs-v{font:650 17px/1.2 var(--font-mono);margin-top:3px;letter-spacing:-.02em}
.fund-stat .fs-v span{font-size:10px;color:var(--text-3);font-weight:500}
.funds-table-wrap{margin-top:12px}
.funds-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:10.5px;color:var(--text-3);padding-bottom:8px}
.funds-meta b{font-family:var(--font-mono);color:var(--text);font-weight:600}
.funds-meta .meta-div{width:3px;height:3px;border-radius:50%;background:var(--border-strong)}
.funds-meta .warn-dot{width:5px;height:5px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 3px rgba(217,119,6,.12)}
.b-bottom-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
.risk-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.risk-stats{display:flex;flex-direction:column;gap:2px}
.risk-stat{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border)}
.risk-stat:last-child{border-bottom:0}
.risk-stat .rs-k{font-size:10.5px;color:var(--text-2)}
.risk-stat .rs-v{font:600 12.5px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.risk-stat .rs-v small{font-size:9px;color:var(--text-3);font-weight:500;margin-left:2px}
.footnote-card{padding:12px 16px;font-size:10px;line-height:1.75;color:var(--text-3);display:flex;gap:10px;align-items:flex-start}
.footnote-card .fn-dot{width:5px;height:5px;border-radius:50%;background:var(--border-strong);margin-top:6px;flex:none}
.footnote-card b{color:var(--text-2);font-weight:600}
.footnote-card .fn-items{display:flex;flex-wrap:wrap;gap:4px 14px}
.b-skel-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.b-skel-main{display:flex;flex-direction:column;gap:10px}

/* ============================================================
   screen C · dashboard
   ============================================================ */
.modebar{
  display:flex;align-items:center;justify-content:center;position:relative;
  padding:8px 12px;border-radius:var(--r-card);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-card);
}
.mode-tabs{display:inline-flex;gap:3px;padding:3px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--border)}
.mode-tabs button{
  display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 18px;border:0;border-radius:var(--r-pill);
  background:transparent;color:var(--text-2);font-size:12.5px;font-weight:500;cursor:pointer;
  transition:background var(--dur-fast) var(--ease-soft),color var(--dur-fast),box-shadow var(--dur-fast),font-weight var(--dur-fast);
}
.mode-tabs button:hover{color:var(--text)}
.mode-tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);font-weight:650;box-shadow:0 1px 3px rgba(15,23,42,.14), 0 0 0 1px rgba(2,132,199,.08)}
:root[data-theme="dark"] .mode-tabs button[aria-selected="true"]{box-shadow:0 1px 4px rgba(0,0,0,.5), 0 0 0 1px rgba(56,189,248,.18)}
.mode-tabs button svg{opacity:.8}
.modebar-actions{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px}
.c-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:18px;margin-top:20px;margin-bottom:2px}
.c-head-titles{min-width:0}
.c-head-titles h1{font-size:22px;font-weight:660;letter-spacing:-.025em;line-height:1.2}
.c-head-titles .sub{font-size:11.5px;color:var(--text-2);margin-top:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.c-select{justify-self:center;width:348px;max-width:100%}
.c-select .select-btn{
  display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-card);
  cursor:pointer;text-align:left;transition:border-color var(--dur-fast),box-shadow var(--dur-fast);
}
.c-select .select-btn:hover{border-color:var(--border-strong)}
.c-select .select-btn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow-ring)}
.c-select .sel-ico{width:26px;height:26px;border-radius:8px;background:var(--brand-grad-soft);color:var(--accent-strong);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.c-select .sel-txt{min-width:0;flex:1}
.c-select .sel-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.c-select .sel-meta{font-size:9.5px;color:var(--text-3);margin-top:2px;font-family:var(--font-mono);display:flex;align-items:center;gap:6px}
.c-select .sel-meta .dot{width:4px;height:4px;border-radius:50%;background:var(--border-strong)}
.c-head-side{justify-self:end;display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.dropdown{position:relative}
.dropdown-menu{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:70;background:var(--surface);

  opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity var(--dur-fast),transform var(--dur-fast);
}
.dropdown-menu.open{opacity:1;transform:none;pointer-events:auto}
.dropdown-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:0;border-radius:8px;background:transparent;
  text-align:left;cursor:pointer;font-size:11.5px;color:var(--text-2);

.dropdown-item[aria-checked="true"] .di-ico{background:var(--surface);color:var(--accent-strong)}
.dropdown-item .di-sub{font-size:9.5px;color:var(--text-3);font-weight:400;margin-top:1px}
.dropdown-item .di-check{margin-left:auto;color:var(--accent);opacity:0}
.dropdown-item[aria-checked="true"] .di-check{opacity:1}
.tags-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.tags-line .tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:9.5px;font-weight:600;background:var(--surface-2);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--border)}

.basket-notice{display:none;margin-top:8px;padding:7px 10px;border-radius:8px;background:var(--warn-wash);border:1px solid rgba(217,119,6,.25);font-size:10.5px;color:var(--warn);line-height:1.5}

.q-cell{

}
.q-cell:hover,.q-cell:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow-card-hover);border-color:var(--border-strong);z-index:2}

/* ---------- text / number helpers ---------- */
function esc(s){
  return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;');
}
function fmt(v,d){
  if (v === null || v === undefined || isNaN(v)) return '—';
  var n = Number(v).toFixed(d === undefined ? 2 : d);
  var neg = n.charAt(0) === '-';
  if (neg) n = n.slice(1);
  var parts = n.split('.');
  var int = parts[0], out = '';
  for (var i = 0; i < int.length; i++) {
    var remaining = int.length - i;
    out += int.charAt(i);
    if (remaining > 1 && (remaining - 1) % 3 === 0) out += ',';
  }
  return (neg ? '-' : '') + out + (parts[1] ? '.' + parts[1] : '');
}
function pct(v,d){ return fmt(v, d === undefined ? 1 : d) + '%'; }
function clsSign(v){ return v > 0 ? 'up' : (v < 0 ? 'down' : 'flat'); }

}
function pillTone(p){ return p < 30 ? 'low' : (p > 70 ? 'high' : 'mid'); }
function pillLabel(p){ return p < 30 ? '低估' : (p > 70 ? '高估' : '中性'); }
function pillHTML(p){
  var tone = pillTone(p);
  return '<span class="pill pill-' + tone + '"><span class="dot"></span>' + pillLabel(p) + ' · ' + fmt(p,0) + '%</span>';
}
function pctCell(p){
  var tone = pillTone(p);
  var color = tone === 'low' ? 'var(--success)' : (tone === 'high' ? 'var(--up)' : 'var(--warn)');
  return '<span class="pct-bar-cell ' + tone + '"><span class="pb"><i style="width:' + Math.max(3,p) + '%;background:' + color + '"></i></span><span class="num">' + fmt(p,1) + '%</span></span>';

function trHTML(cells, cls){

/* ---------- deterministic data ---------- */
function rng(seed){
  var s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function(){ s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}
function randSeries(n, a, b, amp, seed){
  var r = rng(seed);
  var raw = [], v = 0, i;
  for (i = 0; i < n; i++){ v = v * 0.965 + (r() - 0.5) * amp; raw.push(v); }
  var f = raw[0], l = raw[n-1], out = [];
  for (i = 0; i < n; i++){
    var base = a + (b - a) * (i / (n - 1));
    out.push(base + (raw[i] - f - (l - f) * (i / (n - 1))));
  }
  out[n-1] = b;
  return out;
}
function quantile(arr, q){
  var a = arr.slice().sort(function(x,y){ return x - y; });
  if (!a.length) return 0;
  var pos = (a.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
  if (lo === hi) return a[lo];
  return a[lo] + (a[hi] - a[lo]) * (pos - lo);
}
function minMax(arr, pad){
  var mn = Math.min.apply(null, arr), mx = Math.max.apply(null, arr);
  if (mn === mx){ mn -= 1; mx += 1; }
  var p = (mx - mn) * (pad === undefined ? 0.08 : pad);
  return [mn - p, mx + p];
}
function niceTicks(min, max, count){
  var span = max - min;
  if (span <= 0) span = 1;
  var step = Math.pow(10, Math.floor(Math.log(span / count) / Math.LN10));
  var err = (span / count) / step;
  if (err >= 7.5) step *= 10; else if (err >= 3.5) step *= 5; else if (err >= 1.5) step *= 2;
  var lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (var v = lo; v <= hi + step * 0.0001; v += step) out.push(Math.round(v * 1e6) / 1e6);
  return out;
}
function datesBack(n, weekly){
  var end = Date.UTC(2026, 10, 27);

    var m = d.getUTCMonth() + 1, day = d.getUTCDate();

}

  var out = [];

  }

}
function dateLabel(d){ return d.slice(2,7) + '/' + d.slice(8,10); }
function sparkSVG(vals, colorVar, w, h){
  w = w || 76; h = h || 24;
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (mn === mx){ mn -= 1; mx += 1; }
  var pts = [];
  for (var i = 0; i < vals.length; i++){
    var x = (i / (vals.length - 1)) * (w - 2) + 1;
    var y = h - 2 - ((vals[i] - mn) / (mx - mn)) * (h - 4);
    pts.push([Math.round(x*10)/10, Math.round(y*10)/10]);
  }
  var d = pts.map(function(p){ return p[0] + ',' + p[1]; }).join(' ');
  var area = 'M1,' + (h-1) + ' L' + pts.map(function(p){ return p[0] + ',' + p[1]; }).join(' L') + ' L' + (w-1) + ',' + (h-1) + ' Z';
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true" style="display:block;width:100%;height:100%;overflow:visible">' +
    '<path d="' + area + '" fill="' + colorVar + '" opacity=".10"></path>' +
    '<polyline points="' + d + '" fill="none" stroke="' + colorVar + '" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></polyline></svg>';
}
function smoothPath(pts){
  if (pts.length < 2) return '';
  var d = 'M' + pts[0][0] + ',' + pts[0][1];
  for (var i = 1; i < pts.length - 1; i++){
    var mx = (pts[i][0] + pts[i+1][0]) / 2, my = (pts[i][1] + pts[i+1][1]) / 2;
    d += ' Q' + pts[i][0] + ',' + pts[i][1] + ' ' + mx + ',' + my;
  }
  var last = pts[pts.length - 1];
  d += ' L' + last[0] + ',' + last[1];

}

  state.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem(THEME_KEY, t); } catch(e){}
  $$('[data-theme-btn]').forEach(function(b){
    b.setAttribute('aria-pressed', b.getAttribute('data-theme-btn') === t ? 'true' : 'false');
  });
}
function initTheme(){
  var t = 'light';
  try { t = localStorage.getItem(THEME_KEY) || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch(e){}
  applyTheme(t === 'dark' ? 'dark' : 'light');
}

var ROUTES = { A: '#/valuation', B: '#/valuation/HSI', C: '#/dashboard' };
function routeId(){
  var h = location.hash || '#/valuation';
  if (h.indexOf('#/dashboard') === 0) return 'C';
  if (h.indexOf('#/valuation/HSI') === 0 || h.indexOf('#/valuation/HSI'.toLowerCase()) === 0) return 'B';
  return 'A';
}
function goScreen(id){
  if (state.screen === id && document.getElementById('main').children.length){
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  if (location.hash === ROUTES[id]) renderScreen();
  else location.hash = ROUTES[id];
}
function updateScreenNav(){
  $$('.screen-nav button').forEach(function(b){
    b.setAttribute('aria-selected', b.getAttribute('data-screen') === state.screen ? 'true' : 'false');
  });
  $$('.site-nav a').forEach(function(a, i){
    if (i === 0) {
      if (state.screen === 'A') a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    }
  });
}
function renderScreen(){
  var id = routeId();
  state.screen = id;
  var main = document.getElementById('main');
  hideTip();
  closeModal();
  main.innerHTML = id === 'A' ? renderA() : (id === 'B' ? renderB() : renderC());
  updateScreenNav();
  window.scrollTo(0, 0);
  buildCharts(main);
  initCards(main);
  bindStaticTips(main);
  initSpot(main);
  bindScreenEvents();
}

var seriesCache = {};
function seriesFor(idxKey, metric, win){
  var id = idxKey + '-' + metric + '-' + win;
  if (seriesCache[id]) return seriesCache[id];
  var idx = INDICES[idxKey];
  var cur = idx[metric];
  var n = win === 5 ? 261 : (win === 10 ? 521 : 781);
  var mul = { pe: 0, pb: 1, dy: 2, erp: 3 };
  var seed = idx.seed + mul[metric] * 19 + win * 7;
  var start = cur * (metric === 'pe' ? 0.93 : metric === 'pb' ? 0.91 : metric === 'dy' ? 1.09 : 1.07);
  var amp = cur * (metric === 'pe' ? 0.042 : metric === 'pb' ? 0.036 : metric === 'dy' ? 0.022 : 0.028);
  seriesCache[id] = randSeries(n, start, cur, amp, seed);
  return seriesCache[id];
}
function metricValues(idxKey, metric, win, n){
  var idx = INDICES[idxKey];
  var peSeries = seriesFor(idxKey, 'pe', win);
  var out = [];
  for (var i = 0; i < peSeries.length; i++){
    var pe = peSeries[i];
    if (metric === 'pe') out.push(pe);
    else if (metric === 'pb') out.push(pe * (idx.pb / idx.pe));
    else if (metric === 'dy') out.push(idx.dy * (idx.pe / pe));
    else out.push(idx.erp + (100 / pe - 100 / idx.pe) * 0.92);
  }
  return out;
}
function metricMeta(metric, idxKey, win){
  var idx = INDICES[idxKey];
  var vals = metricValues(idxKey, metric, win);
  return {
    idx: idx,
    metric: metric,
    def: METRICS[metric],
    vals: vals,
    cur: idx[metric],
    pct: idx[metric + 'Pct'],
    q20: quantile(vals, 0.20),
    q50: quantile(vals, 0.50),
    q80: quantile(vals, 0.80),
    dates: datesBack(vals.length, true)
  };
}
function fmtMetric(v, metric){
  var def = METRICS[metric];
  return fmt(v, def.dec) + (def.unit === '%' ? '%' : def.unit);
}
function metricRefLabel(v, metric){ return fmt(v, METRICS[metric].dec) + METRICS[metric].unit; }

function chartBase(W, H){
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="xMidYMid meet" role="img">';
}
function pctRank(vals, v){
  var c = 0;
  for (var i = 0; i < vals.length; i++) if (vals[i] <= v) c++;
  return c / vals.length * 100;
}
function zoneName(p){ return p < 30 ? '低估' : (p > 70 ? '高估' : '中性'); }

CHARTS.valBand = function(el){
  var metric = state.A.metric, key = state.A.index, win = state.A.win;
  var mm = metricMeta(metric, key, win);
  var def = METRICS[metric];
  var W = chartWidth(el), H = parseInt(el.getAttribute('data-h') || '272', 10);
  var pad = { l: 46, r: 82, t: 18, b: 27 };
  var pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  var mm2 = minMax(mm.vals, 0.10);
  var ticks = niceTicks(mm2[0], mm2[1], 4);
  var mn = Math.min(mm2[0], ticks[0]), mx = Math.max(mm2[1], ticks[ticks.length-1]);
  var y = function(v){ return pad.t + ph * (1 - (v - mn) / (mx - mn)); };
  var n = mm.vals.length;
  var x = function(i){ return pad.l + i / (n - 1) * pw; };
  var q30 = quantile(mm.vals, 0.30), q70 = quantile(mm.vals, 0.70);
  var pts = mm.vals.map(function(v, i){ return [Math.round(x(i)*10)/10, Math.round(y(v)*10)/10]; });
  var svg = chartBase(W, H);
  svg += '<defs><linearGradient id="gvBand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + def.color + '" stop-opacity=".20"></stop><stop offset="1" stop-color="' + def.color + '" stop-opacity=".01"></stop></linearGradient></defs>';
  svg += rect(pad.l, y(q70), pw, y(mx) - y(q70), 'zone-high');
  svg += rect(pad.l, y(q30), pw, y(q70) - y(q30), 'zone-mid');
  svg += rect(pad.l, y(mn), pw, y(q30) - y(mn), 'zone-low');
  ticks.forEach(function(t){
    if (t < mn - 0.001 || t > mx + 0.001) return;
    svg += '<line class="grid" x1="' + pad.l + '" y1="' + y(t) + '" x2="' + (W-pad.r) + '" y2="' + y(t) + '"></line>';
    svg += text(pad.l - 8, y(t) + 3, fmt(t, def.dec), 'tick', 'end');
  });
  var years = xLabelFs(W).map(function(f){ return Math.round(f * (n-1)); });
  years.forEach(function(i){
    svg += text(x(i), H - 7, dateLabel(mm.dates[i]), 'tick', i === 0 ? 'start' : (i === n-1 ? 'end' : 'middle'));
  });
  svg += '<line class="axis" x1="' + pad.l + '" y1="' + (pad.t+ph) + '" x2="' + (W-pad.r) + '" y2="' + (pad.t+ph) + '"></line>';
  var refs = [
    { v: mm.q20, cls: 'ref-low', label: '机会 ' + metricRefLabel(mm.q20, metric) },
    { v: mm.q50, cls: 'ref-mid', label: '中位 ' + metricRefLabel(mm.q50, metric) },
    { v: mm.q80, cls: 'ref-high', label: '危险 ' + metricRefLabel(mm.q80, metric) }
  ];
  refs.forEach(function(r){
    if (r.v < mn || r.v > mx) return;
    svg += '<line class="ref ' + r.cls + '" x1="' + pad.l + '" y1="' + y(r.v) + '" x2="' + (W-pad.r) + '" y2="' + y(r.v) + '"></line>';
    svg += text(W - pad.r + 7, y(r.v) + 3, r.label, 'lbl-faint', 'start');
  });
  var area = 'M' + pts[0][0] + ',' + (pad.t+ph) + ' L' + polyline(pts).split(' ').join(' L') + ' L' + pts[n-1][0] + ',' + (pad.t+ph) + ' Z';
  svg += '<path d="' + area + '" fill="url(#gvBand)"></path>';
  svg += '<path d="' + smoothPath(pts) + '" class="line-sky" style="stroke:' + def.color + '"></path>';
  var cx = x(n-1), cy = y(mm.cur);
  svg += '<circle class="halo" cx="' + cx + '" cy="' + cy + '" r="10" style="fill:' + def.color + '"></circle>';
  svg += '<circle class="dot-current" cx="' + cx + '" cy="' + cy + '" r="4" style="fill:' + def.color + '"></circle>';
  if (W >= 480) svg += text(Math.min(cx, W - pad.r - 8), cy - 10, fmtMetric(mm.cur, metric), 'lbl-strong', 'end');
  svg += '<g class="hover-g" style="opacity:0"><line class="cross" x1="0" y1="' + pad.t + '" x2="0" y2="' + (pad.t+ph) + '"></line><circle class="hover-dot" cx="0" cy="0" r="4"></circle></g>';
  svg += '<rect class="ov" x="' + pad.l + '" y="' + pad.t + '" width="' + pw + '" height="' + ph + '" fill="transparent" style="cursor:crosshair"></rect>';
  svg += '</svg>';
  el.innerHTML = svg;
  var cross = el.querySelector('.cross'), hd = el.querySelector('.hover-dot'), hg = el.querySelector('.hover-g'), ov = el.querySelector('.ov');
  function onMove(e){
    var r = el.getBoundingClientRect();
    var px = (e.clientX - r.left) * (W / r.width);
    var i = Math.max(0, Math.min(n - 1, Math.round((px - pad.l) / pw * (n - 1))));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i));
    hd.setAttribute('cx', x(i)); hd.setAttribute('cy', y(mm.vals[i])); hd.style.fill = def.color;
    hg.style.opacity = 1;
    var p = i === n - 1 ? mm.pct : pctRank(mm.vals, mm.vals[i]);
    var tip = '<h4><span class="dot"></span>' + mm.idx.name + ' · ' + def.label + '</h4>' +
      '<div class="tr"><span>' + mm.dates[i] + '</span><b>' + fmtMetric(mm.vals[i], metric) + '</b></div>' +
      '<div class="tr"><span>历史分位</span><b>' + fmt(p, 1) + '% · ' + zoneName(p) + '</b></div>' +
      '<div class="tr"><span>机会 / 中位 / 危险</span><b>' + fmtMetric(mm.q20, metric) + ' / ' + fmtMetric(mm.q50, metric) + ' / ' + fmtMetric(mm.q80, metric) + '</b></div>' +
      '<div class="tnote">周频 · 分位窗口 ' + WIN_LABELS[win] + ' · 数据截至 2026-11-27</div>';
    showTip(tip, e.clientX, r.top + 16);
  }
  ov.addEventListener('mousemove', onMove);
  ov.addEventListener('mouseleave', function(){ hg.style.opacity = 0; hideTip(); });
};

function regression(pts){
  var n = pts.length, sx = 0, sy = 0, sxx = 0, sxy = 0, syy = 0;
  for (var i = 0; i < n; i++){
    sx += pts[i].x; sy += pts[i].y; sxx += pts[i].x * pts[i].x; sxy += pts[i].x * pts[i].y; syy += pts[i].y * pts[i].y;
  }
  var den = n * sxx - sx * sx;
  var b = den === 0 ? 0 : (n * sxy - sx * sy) / den;
  var a = (sy - b * sx) / n;
  var ssTot = syy - sy * sy / n;
  var ssRes = 0;
  for (var j = 0; j < n; j++){ var e = pts[j].y - (a + b * pts[j].x); ssRes += e * e; }
  return { a: a, b: b, r2: ssTot === 0 ? 0 : 1 - ssRes / ssTot };
}

CHARTS.hsiDual = function(el){

  var W = chartWidth(el), H = parseInt(el.getAttribute('data-h') || '330', 10);
  var pad = { l: 46, r: 64, t: 20, b: 27 };
  var pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  var peMM = minMax(pe, 0.10);
  var peTicks = niceTicks(peMM[0], peMM[1], 4);
  var peMin = Math.min(peMM[0], peTicks[0]), peMax = Math.max(peMM[1], peTicks[peTicks.length-1]);
  var pxMM = minMax(px, 0.10);
  var pxTicks = niceTicks(pxMM[0], pxMM[1], 4);
  var pxMin = Math.min(pxMM[0], pxTicks[0]), pxMax = Math.max(pxMM[1], pxTicks[pxTicks.length-1]);
  var yPe = function(v){ return pad.t + ph * (1 - (v - peMin) / (peMax - peMin)); };
  var yPx = function(v){ return pad.t + ph * (1 - (v - pxMin) / (pxMax - pxMin)); };
  var x = function(i){ return pad.l + i / (n - 1) * pw; };

    svg += text(pad.l + 6, yPe(r.v) - 4, r.label, 'lbl-faint', 'start');
  });
  var area = 'M' + pePts[0][0] + ',' + (pad.t+ph) + ' L' + polyline(pePts).split(' ').join(' L') + ' L' + pePts[n-1][0] + ',' + (pad.t+ph) + ' Z';
  svg += '<path d="' + area + '" fill="url(#gvHsi)"></path>';

  svg += '<rect class="ov" x="' + pad.l + '" y="' + pad.t + '" width="' + pw + '" height="' + ph + '" fill="transparent" style="cursor:crosshair"></rect>';
  svg += '</svg>';
  el.innerHTML = svg;
  var cross = el.querySelector('.cross'), hd = el.querySelector('.hover-dot'), hg = el.querySelector('.hover-g'), ov = el.querySelector('.ov');

    showTip(tip, e.clientX, r.top + 16);
  });

};

CHARTS.periodBars = function(el){
  var W = chartWidth(el), H = parseInt(el.getAttribute('data-h') || '210', 10);
  var pad = { l: 34, r: 12, t: 14, b: 24 };
  var pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  var groups = ['1y','3y','5y'];
  var vals = groups.map(function(p){ return [B_RISK[p].ret, B_RISK[p].vol, Math.abs(B_RISK[p].dd)]; });
  var max = Math.max.apply(null, vals.map(function(v){ return v[1]; })) * 1.15;
  var y = function(v){ return pad.t + ph * (1 - v / max); };
  var gw = pw / groups.length, bw = Math.min(20, gw / 6);
  var svg = chartBase(W, H);
  niceTicks(0, max, 3).forEach(function(t){
    svg += '<line class="grid" x1="' + pad.l + '" y1="' + y(t) + '" x2="' + (W-pad.r) + '" y2="' + y(t) + '"></line>';
    svg += text(pad.l - 6, y(t) + 3, fmt(t, 0) + '%', 'tick', 'end');
  });
  var colors = ['var(--chart-sky)', 'var(--chart-violet)', 'var(--chart-rose)'];
  groups.forEach(function(g, gi){
    var cx = pad.l + gw * gi + gw / 2;
    vals[gi].forEach(function(v, si){
      var x = cx - bw * 1.7 + si * bw * 1.2;
      var barH = Math.max(2, ph * (v / max));
      svg += '<rect class="bar" x="' + x + '" y="' + (pad.t + ph - barH) + '" width="' + bw + '" height="' + barH + '" rx="2" fill="' + colors[si] + '" opacity=".82" data-p="' + g + '" data-k="' + si + '" tabindex="0" style="cursor:pointer"></rect>';
    });
    svg += text(cx, H - 8, g.replace('y', 'Y'), 'tick', 'middle');
  });
  svg += '<line class="axis" x1="' + pad.l + '" y1="' + (pad.t+ph) + '" x2="' + (W-pad.r) + '" y2="' + (pad.t+ph) + '"></line>';
  svg += '</svg>';
  el.innerHTML = svg;
  var labels = ['年化收益', '年化波动', '最大回撤（abs）'];
  $$('rect[data-p]', el).forEach(function(r){
    function tip(e){
      var p = r.getAttribute('data-p'), k = Number(r.getAttribute('data-k'));
      var v = k === 0 ? B_RISK[p].ret : (k === 1 ? B_RISK[p].vol : B_RISK[p].dd);
      var html = '<h4><span class="dot"></span>' + p.replace('y',' 年') + ' · ' + labels[k] + '</h4><div class="tr"><span>数值</span><b>' + fmt(v, 1) + '%</b></div><div class="tnote">区间按日频收益计算；基准为 HSI 全收益（价格 × HKDCNY 近似）。</div>';
      showTip(html, e.clientX, e.clientY);
    }
    r.addEventListener('mouseenter', tip); r.addEventListener('mousemove', tip); r.addEventListener('mouseleave', hideTip);
  });
};

  svg += '<g class="hover-g" style="opacity:0"><line class="cross" x1="0" y1="' + pad.t + '" x2="0" y2="' + (pad.t+ph) + '"></line><circle class="hover-dot" cx="0" cy="0" r="3.5"></circle><circle class="hover-dot2" cx="0" cy="0" r="3" style="fill:var(--chart-violet)"></circle></g>';
